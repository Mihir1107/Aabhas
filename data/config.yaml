defect_type_glossary:
  GOOD: Nominal part
  I_STEEP_DRIFTER: Elevated degradation rate, stays inside datasheet limits
  II_STEP_DEFECT: Nominal drift plus a discrete jump between two checkpoints
  III_CENTRE_HIDER: Univariately central on every parameter, anomalous only jointly
  IV_CORRELATION_BREAK: Individually normal, leakage/delay relationship inverted
  Va_MILDLY_HIGH_STABLE: TRAP. Mildly elevated level inside normal lot spread, minimal
    drift. Not a defect.
  Vb_EXTREME_LEVEL: DEFECT. Level far outside the lot distribution but still inside
    datasheet limits, minimal drift. This is the problem statement's own worked example.
  VI_LOT_SHIFT: TRAP. Whole-lot process shift. Not a part defect.
  VII_FIXTURE_ARTIFACT: TRAP. Socket/board thermal artifact. Not a part defect.
