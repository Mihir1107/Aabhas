<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230B6360'/%3E%3C/svg%3E">
<title>Burn-In Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --ground:#F2F5F5; --surface:#FFF; --sunk:#E8EDED; --ink:#111819; --mid:#3B4A4C;
  --mute:#6A797B; --rule:#D6DEDE; --rule2:#B3C0C0; --accent:#0B6360; --accent-soft:#DEEEEC;
  --on-accent:#FFFFFF;
  --pass:#2A6A41; --pass-bg:#E3EFE7; --watch:#1F5C86; --watch-bg:#E1ECF4;
  --review:#8A5C05; --review-bg:#F8EEDB; --reject:#A32E19; --reject-bg:#F8E5E0;
  --fixture:#5C3E8E; --fixture-bg:#EDE7F6; --invalid:#5B6668; --invalid-bg:#E7EBEB;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1214; --surface:#141B1D; --sunk:#0F1618; --ink:#E8EEED; --mid:#B4C2C2;
  --mute:#839597; --rule:#222D2F; --rule2:#374446; --accent:#4FBFB1; --accent-soft:#12302D;
  --on-accent:#07201E;
  --pass:#72C594; --pass-bg:#152C1E; --watch:#6FB2E0; --watch-bg:#132735;
  --review:#DBA646; --review-bg:#31270F; --reject:#EC8067; --reject-bg:#341C16;
  --fixture:#B79BE8; --fixture-bg:#251C36; --invalid:#8B9A9C; --invalid-bg:#1B2223;
}}
:root[data-theme="dark"]{
  --ground:#0D1214; --surface:#141B1D; --sunk:#0F1618; --ink:#E8EEED; --mid:#B4C2C2;
  --mute:#839597; --rule:#222D2F; --rule2:#374446; --accent:#4FBFB1; --accent-soft:#12302D;
  --on-accent:#07201E;
  --pass:#72C594; --pass-bg:#152C1E; --watch:#6FB2E0; --watch-bg:#132735;
  --review:#DBA646; --review-bg:#31270F; --reject:#EC8067; --reject-bg:#341C16;
  --fixture:#B79BE8; --fixture-bg:#251C36; --invalid:#8B9A9C; --invalid-bg:#1B2223;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--rule2);
  background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:0}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.on:hover{color:var(--on-accent)}

header{background:var(--surface);border-bottom:2px solid var(--ink);padding:14px 20px}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:1.15rem;font-weight:700}
.prov{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.provenance{margin-top:8px;font-size:.75rem;color:var(--mid);max-width:88ch}
.lotbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.label{font-size:.66rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.tiers{display:flex;gap:0;margin-top:12px;border:1px solid var(--rule);overflow:hidden}
.tiercell{flex:1;padding:8px 10px;border-right:1px solid var(--rule);min-width:78px}
.tiercell:last-child{border-right:none}
.tiercell .n{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tiercell .t{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

.wrap{display:grid;grid-template-columns:330px 1fr;gap:0;height:calc(100vh - 200px);min-height:520px}
.pane{overflow-y:auto}
.left{border-right:1px solid var(--rule2);background:var(--surface)}
.right{padding:18px 22px;background:var(--ground)}

.filters{display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--surface);z-index:2;flex-wrap:wrap}
.filters button{padding:3px 8px;font-size:.72rem}
.row{display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:center;
  padding:0 0 0 0;border-bottom:1px solid var(--rule);cursor:pointer}
.row:hover{background:var(--sunk)}
.row.sel{background:var(--accent-soft)}
.stripe{width:9px;align-self:stretch;min-height:38px}
.rmid{padding:8px 0}
.rid{font-size:.78rem;font-weight:500}
.rsub{font-size:.68rem;color:var(--mute)}
.rscore{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--mid);padding-right:12px}

.chip{display:inline-block;font-size:.62rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;white-space:nowrap}
.t-PASS{color:var(--pass);background:var(--pass-bg)}
.t-WATCH{color:var(--watch);background:var(--watch-bg)}
.t-REVIEW{color:var(--review);background:var(--review-bg)}
.t-REJECT{color:var(--reject);background:var(--reject-bg)}
.t-FIXTURE_SUSPECT{color:var(--fixture);background:var(--fixture-bg)}
.t-MEASUREMENT_INVALID{color:var(--invalid);background:var(--invalid-bg)}
.s-PASS{background:var(--pass)}.s-WATCH{background:var(--watch)}
.s-REVIEW{background:var(--review)}.s-REJECT{background:var(--reject)}
.s-FIXTURE_SUSPECT{background:var(--fixture)}.s-MEASUREMENT_INVALID{background:var(--invalid)}

.card{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:10px}
.dhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.dhead h2{font-size:1.35rem;font-weight:700}
.action{font-family:"Source Serif 4",Georgia,serif;font-size:.95rem;
  border-left:3px solid currentColor;padding:6px 0 6px 12px;margin-top:10px}
.evid{width:100%;border-collapse:collapse;font-size:.78rem}
.evid td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--mid)}
.evid tr:last-child td{border-bottom:none}
.evid td:first-child{width:150px;color:var(--mute);font-weight:600;font-size:.7rem;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.chartbox{border:1px solid var(--rule);padding:8px 6px 2px;background:var(--surface)}
.chartttl{font-size:.7rem;font-weight:600;color:var(--mute);letter-spacing:.05em;
  text-transform:uppercase;padding-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.reveal{border:1px dashed var(--rule2);padding:12px 14px;margin-top:12px}
.reveal.shown{border-style:solid;border-color:var(--accent)}
.truthgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.truthgrid .k{font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.truthgrid .v{font-size:.86rem;font-weight:600}
.verdict-ok{color:var(--pass)}.verdict-bad{color:var(--reject)}
.board{margin-bottom:16px}
.boardttl{font-size:.72rem;color:var(--mute);margin-bottom:5px;letter-spacing:.04em}
.grid{display:grid;gap:2px}
.cell{aspect-ratio:1;border:1px solid transparent;cursor:pointer;min-width:11px}
.cell:hover{border-color:var(--ink)}
.cell.sel{border-color:var(--ink);border-width:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px;font-size:.7rem;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.empty{color:var(--mute);font-size:.9rem;padding:40px 0;text-align:center}
.note{font-size:.75rem;color:var(--mute);margin-top:8px;max-width:80ch}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;height:auto}
  .left{border-right:none;border-bottom:1px solid var(--rule2);max-height:340px}
}
</style>

<header>
  <div class="brandrow">
    <h1>Burn-In Screening &mdash; QA Inspector</h1>
    <span class="prov mono" id="prov"></span>
    <span style="flex:1"></span>
    <button id="themeBtn" title="Toggle light and dark">Theme</button>
  </div>
  <div class="provenance" id="provnote"></div>
  <div class="lotbar"><span class="label">Lot</span><span id="lotbtns"></span></div>
  <div class="tiers" id="tiers"></div>
</header>

<div class="wrap">
  <div class="pane left">
    <div class="filters" id="filters"></div>
    <div id="worklist"></div>
  </div>
  <div class="pane right" id="detail"></div>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const TIER_ORDER = ['REJECT','REVIEW','FIXTURE_SUSPECT','MEASUREMENT_INVALID','WATCH','PASS'];
const CPS = D.checkpoints;
let lot = D.meta.lots[0], filter = 'NEEDS ACTION', sel = null, view = 'part';

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tierVar = t => ({PASS:'pass',WATCH:'watch',REVIEW:'review',REJECT:'reject',
  FIXTURE_SUSPECT:'fixture',MEASUREMENT_INVALID:'invalid'}[t]);

$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};

$('#prov').textContent = D.meta.dataset + ' · ' + D.meta.commit + ' · ' + D.meta.generated_utc;
$('#provnote').textContent = D.meta.split_note +
  ' Every score, tier and explanation below is produced by the committed pipeline; ' +
  'nothing on this page is mocked. Ground truth stays hidden until you ask for it, ' +
  'and is never an input to any decision shown.';

function lotButtons(){
  const c=$('#lotbtns'); c.innerHTML='';
  D.meta.lots.forEach(L=>{
    const b=el('button','',L); if(L===lot) b.className='on';
    b.onclick=()=>{lot=L;sel=null;render();};
    c.appendChild(b); c.appendChild(document.createTextNode(' '));
  });
}
function tierStrip(){
  const c=$('#tiers'); c.innerHTML='';
  const counts=D.lots[lot].tier_counts;
  TIER_ORDER.forEach(t=>{
    const n=counts[t]||0; if(!n) return;
    const d=el('div','tiercell');
    d.appendChild(el('div','n',String(n)));
    const s=el('div','t',t.replace('_',' '));
    s.style.color='var(--'+tierVar(t)+')';
    d.appendChild(s); c.appendChild(d);
  });
}
function parts(){ return D.lots[lot].parts; }
function sorted(){
  const r=t=>TIER_ORDER.indexOf(t);
  return parts().slice().sort((a,b)=> r(a.tier)-r(b.tier) || (b.score||0)-(a.score||0));
}
function filters(){
  const c=$('#filters'); c.innerHTML='';
  const counts=D.lots[lot].tier_counts;
  const opts=['NEEDS ACTION','ALL'].concat(TIER_ORDER.filter(t=>counts[t]));
  opts.forEach(o=>{
    const n = o==='ALL'?parts().length : o==='NEEDS ACTION'
      ? parts().filter(p=>p.tier!=='PASS').length : counts[o];
    const b=el('button','',o.replace('_',' ')+' '+n);
    if(o===filter) b.className='on';
    b.onclick=()=>{filter=o;render();}; c.appendChild(b);
  });
}
function visible(){
  const s=sorted();
  if(filter==='ALL') return s;
  if(filter==='NEEDS ACTION') return s.filter(p=>p.tier!=='PASS');
  return s.filter(p=>p.tier===filter);
}
function worklist(){
  const c=$('#worklist'); c.innerHTML='';
  const v=visible();
  if(!v.length){ c.appendChild(el('div','empty','No parts in this filter.')); return; }
  v.forEach(p=>{
    const r=el('div','row'+(sel===p.id?' sel':'')); r.tabIndex=0;
    r.appendChild(el('div','stripe s-'+p.tier));
    const m=el('div','rmid');
    m.appendChild(el('div','rid mono',esc(p.id)));
    m.appendChild(el('div','rsub',p.tier.replace('_',' ')+' · '+
      esc(D.reason_text[p.primary]||p.primary)));
    r.appendChild(m);
    r.appendChild(el('div','rscore mono',p.score==null?'':p.score.toFixed(2)));
    const go=()=>{sel=p.id;view='part';render();};
    r.onclick=go; r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
    c.appendChild(r);
  });
}
function chart(p,prm){
  const W=300,H=132,L=46,R=8,T=10,B=24;
  const st=D.lots[lot].stats[prm];
  const meds=CPS.map(t=>st[String(t)].median);
  const los=CPS.map(t=>st[String(t)].pat_lo), his=CPS.map(t=>st[String(t)].pat_hi);
  const vals=p.v[prm];
  const all=[].concat(meds,los,his,vals.filter(v=>v!=null));
  let mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const X=i=>L+(W-L-R)*(CPS[i]-CPS[0])/(CPS[CPS.length-1]-CPS[0]);
  const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const line=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  let band=line(his);
  for(let i=los.length-1;i>=0;i--) band+=' L'+X(i).toFixed(1)+','+Y(los[i]).toFixed(1);
  band+=' Z';
  let dots='', segs=[], cur=[];
  vals.forEach((v,i)=>{
    if(v==null){ if(cur.length)segs.push(cur); cur=[]; }
    else { cur.push([i,v]);
      dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="var(--accent)"/>'; }
  });
  if(cur.length)segs.push(cur);
  const pp=segs.map(s=>s.map((d,i)=>(i?'L':'M')+X(d[0]).toFixed(1)+','+Y(d[1]).toFixed(1)).join(' ')).join(' ');
  const ticks=CPS.map((t,i)=>'<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+
    '" font-size="9" fill="var(--mute)" text-anchor="middle">'+t+'h</text>').join('');
  const yl=[mn+(mx-mn)*0.95,mn+(mx-mn)*0.05].map(v=>
    '<text x="'+(L-5)+'" y="'+(Y(v)+3).toFixed(1)+
    '" font-size="9" fill="var(--mute)" text-anchor="end">'+Number(v).toPrecision(3)+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+prm+' trajectory">'+
    '<path d="'+band+'" fill="var(--accent)" opacity=".10"/>'+
    '<path d="'+line(meds)+'" fill="none" stroke="var(--mute)" stroke-width="1.2" stroke-dasharray="4,3"/>'+
    '<path d="'+pp+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+
    dots+ticks+yl+'</svg>';
}
function boardMap(){
  const c=el('div');
  c.appendChild(el('h3','','Board map — spatial view'));
  c.appendChild(el('div','note','Each square is a socket position. An anomaly that '+
    'clusters by position is the chamber or the fixture, not the component &mdash; that is '+
    'what the FIXTURE SUSPECT tier exists to say, and why those parts are investigated '+
    'rather than scrapped.'));
  const byBoard={};
  parts().forEach(p=>{(byBoard[p.board]=byBoard[p.board]||[]).push(p);});
  const leg=el('div','legend');
  TIER_ORDER.filter(t=>D.lots[lot].tier_counts[t]).forEach(t=>
    leg.appendChild(el('span','','<i style="background:var(--'+tierVar(t)+')"></i>'+t.replace('_',' '))));
  c.appendChild(leg);
  Object.keys(byBoard).sort().forEach(b=>{
    const ps=byBoard[b];
    const maxc=Math.max.apply(null,ps.map(p=>p.col))+1;
    const maxr=Math.max.apply(null,ps.map(p=>p.row))+1;
    const box=el('div','board');
    box.appendChild(el('div','boardttl mono',esc(b)+' · '+ps.length+' parts'));
    const g=el('div','grid');
    g.style.gridTemplateColumns='repeat('+maxc+',minmax(0,1fr))';
    g.style.maxWidth=(maxc*18)+'px';
    const at={}; ps.forEach(p=>{at[p.row+','+p.col]=p;});
    for(let r=0;r<maxr;r++){ for(let cc=0;cc<maxc;cc++){
      const p=at[r+','+cc];
      const d=el('div','cell'+(p&&p.id===sel?' sel':''));
      if(p){ d.style.background='var(--'+tierVar(p.tier)+')';
        d.title=p.id+' · '+p.tier; d.tabIndex=0;
        const go=()=>{sel=p.id;view='part';render();};
        d.onclick=go; d.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
      } else { d.style.background='var(--sunk)'; }
      g.appendChild(d);
    }}
    box.appendChild(g); c.appendChild(box);
  });
  return c;
}
function detail(){
  const c=$('#detail'); c.innerHTML='';
  const tabs=el('div','tabs');
  [['part','Part detail'],['board','Board map']].forEach(pair=>{
    const b=el('button','',pair[1]); if(view===pair[0]) b.className='on';
    b.onclick=()=>{view=pair[0];render();}; tabs.appendChild(b);
  });
  c.appendChild(tabs);
  if(view==='board'){ c.appendChild(boardMap()); return; }
  const p=parts().find(x=>x.id===sel);
  if(!p){ c.appendChild(el('div','empty',
    'Select a component from the worklist to see why the system reached its decision.'));
    return; }

  const v=el('div','card');
  const h=el('div','dhead');
  h.appendChild(el('h2','mono',esc(p.id)));
  h.appendChild(el('span','chip t-'+p.tier,p.tier.replace('_',' ')));
  h.appendChild(el('span','rsub','board '+esc(p.board)+' · socket (r'+p.row+', c'+p.col+')'));
  v.appendChild(h);
  v.appendChild(el('div','','<b>Primary reason:</b> '+esc(D.reason_text[p.primary]||p.primary)+
    (p.secondary?'<br><b>Secondary:</b> '+esc(D.reason_text[p.secondary]||p.secondary):'')));
  const a=el('div','action',esc(D.actions[p.tier]||''));
  a.style.color='var(--'+tierVar(p.tier)+')';
  v.appendChild(a); c.appendChild(v);

  const ev=el('div','card');
  ev.appendChild(el('h3','','Evidence the decision rests on'));
  const tb=el('table','evid');
  p.lines.forEach(pair=>{
    const tr=el('tr');
    tr.appendChild(el('td','',esc(pair[0])));
    tr.appendChild(el('td','mono',esc(pair[1])));
    tb.appendChild(tr);
  });
  ev.appendChild(tb);
  if(p.hypotheses&&p.hypotheses.length)
    ev.appendChild(el('div','note','<b>Mechanism hypothesis:</b> '+esc(p.hypotheses.join('; '))));
  ev.appendChild(el('div','note','These lines come from the same explain/ code that writes '+
    'the PDF disposition reports in reports/ &mdash; not a summary of them.'));
  c.appendChild(ev);

  const ch=el('div','card');
  ch.appendChild(el('h3','','Trajectory against the lot it was burned in with'));
  ch.appendChild(el('div','note','Solid line is this part, dashed is the lot median. The '+
    'shaded band is the AEC-Q001 dynamic PAT limit at 6&sigma;, clipped to the datasheet '+
    'limit. A gap in the line means no measurement at that checkpoint.'));
  const g=el('div','charts');
  D.params.forEach(pr=>{
    const b=el('div','chartbox');
    b.appendChild(el('div','chartttl',pr.name+' ('+pr.unit+')'));
    b.insertAdjacentHTML('beforeend',chart(p,pr.name));
    g.appendChild(b);
  });
  ch.appendChild(g); c.appendChild(ch);

  if(p.mb&&Object.keys(p.mb).length){
    const mb=el('div','card');
    mb.appendChild(el('h3','','Module B — 168 h forecast from 0 h and 24 h only'));
    const t=el('table','evid');
    D.params.forEach(pr=>{
      const m=p.mb[pr.name]; if(!m||m.point==null) return;
      const br=(m.upper!=null&&m.lsafe!=null&&m.upper>m.lsafe);
      const tr=el('tr');
      tr.appendChild(el('td','',pr.name));
      tr.appendChild(el('td','mono',
        'predicted '+m.point.toFixed(3)+' '+pr.unit+
        ' · 95% upper '+(m.upper==null?'—':m.upper.toFixed(3))+
        ' · <span style="color:var(--'+(br?'reject':'pass')+')">'+
        (br?'EXCEEDS':'within')+' safe limit '+
        (m.lsafe==null?'—':m.lsafe.toFixed(3))+'</span>'));
      t.appendChild(tr);
    });
    mb.appendChild(t);
    mb.appendChild(el('div','note','The safe limit is derived from PRIOR lots only. This '+
      'lot’s own 168 h readings do not exist yet when the 24 h decision is made.'));
    c.appendChild(mb);
  }

  const rv=el('div','card');
  rv.appendChild(el('h3','','Ground truth'));
  rv.appendChild(el('div','note','Hidden by design. Read the evidence and decide, then '+
    'check. The label was never an input to any number above.'));
  const box=el('div','reveal');
  const btn=el('button','','Reveal what this part actually was');
  btn.onclick=()=>{
    const t=p.truth;
    const held=(p.tier==='REVIEW'||p.tier==='REJECT');
    // MEASUREMENT_INVALID and FIXTURE_SUSPECT send the part to a re-test:
    // neither ships it nor scraps it, so neither is an escape or a false alarm
    const retest=(p.tier==='MEASUREMENT_INVALID'||p.tier==='FIXTURE_SUSPECT');
    const ok = retest || (t.is_defective ? held : !held);
    box.className='reveal shown'; box.innerHTML='';
    const gr=el('div','truthgrid');
    [['Injected type',t.defect_type],['Truly defective',t.is_defective?'YES':'no'],
     ['Severity',t.severity||'—'],['Mechanism',t.mechanism||'—']].forEach(kv=>{
      const d=el('div');
      d.appendChild(el('div','k',kv[0]));
      d.appendChild(el('div','v',esc(kv[1])));
      gr.appendChild(d);
    });
    box.appendChild(gr);
    box.appendChild(el('div','action '+(ok?'verdict-ok':'verdict-bad'),
      retest ? (t.is_defective?'Sent for RE-TEST, not dispositioned. It is a real defect; the re-test is where it would be caught.'
                              :'Sent for RE-TEST, not dispositioned. It is a good part; the re-test clears it.') :
      ok ? (t.is_defective?'Caught. This defect was held before it could ship.'
                          :'Correctly released. A good part was not scrapped.')
         : (t.is_defective?'MISSED — this defect escaped screening.'
                          :'FALSE ALARM — a good part was held.')));
  };
  box.appendChild(btn); rv.appendChild(box); c.appendChild(rv);
}
function render(){ lotButtons(); tierStrip(); filters(); worklist(); detail(); }
render();
</script>
